name: Build and Attach Standalone Android APK

on:
  release:
    types: [published, created]
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target_release_tag:
        description: 'Release Tag to attach the APK to (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "Using Android SDK at: $ANDROID_HOME"
          ls -la "$ANDROID_HOME/build-tools"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix mobile

      - name: Build portal web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npm run sync:android --prefix mobile

      - name: Configure Android release signing keystore
        run: |
          mkdir -p mobile/android/signing
          if [ -n "${{ secrets.PORTAL_RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.PORTAL_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > mobile/android/signing/portal-release.p12
            echo "PORTAL_RELEASE_KEYSTORE=$(pwd)/mobile/android/signing/portal-release.p12" >> $GITHUB_ENV
            echo "PORTAL_RELEASE_PASSWORD=${{ secrets.PORTAL_RELEASE_PASSWORD }}" >> $GITHUB_ENV
          elif [ -f "mobile/android/signing/portal-release.p12" ]; then
            echo "PORTAL_RELEASE_KEYSTORE=$(pwd)/mobile/android/signing/portal-release.p12" >> $GITHUB_ENV
            echo "PORTAL_RELEASE_PASSWORD=portal-release-firstpjbb-2026" >> $GITHUB_ENV
          else
            AUTOGEN_KEY_SECRET=$(openssl rand -hex 24)
            keytool -genkeypair -storetype PKCS12 -keystore mobile/android/signing/portal-release.p12 \
              -storepass "$AUTOGEN_KEY_SECRET" -alias portal-release -keyalg RSA -keysize 3072 \
              -validity 10000 -dname "CN=1st PJ BB Portal, O=1st Petaling Jaya Boys Brigade, C=MY"
            echo "PORTAL_RELEASE_KEYSTORE=$(pwd)/mobile/android/signing/portal-release.p12" >> $GITHUB_ENV
            echo "PORTAL_RELEASE_PASSWORD=$AUTOGEN_KEY_SECRET" >> $GITHUB_ENV
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x mobile/android/gradlew

      - name: Build Standalone Release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease

      - name: Verify APK Signature
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Calculate APK SHA-256
        working-directory: mobile/android/app/build/outputs/apk/release
        run: |
          sha256sum app-release.apk > app-release.apk.sha256
          cat app-release.apk.sha256

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: app-release
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          overwrite: true

  publish-apk:
    name: Publish Release APK
    needs: build-apk
    if: >-
      github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') ||
      github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.target_release_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download signed APK artifact
        uses: actions/download-artifact@v6
        with:
          name: app-release
          path: release

      - name: Verify downloaded APK checksum
        working-directory: release
        run: sha256sum --check app-release.apk.sha256

      - name: Attach APK to GitHub Release
        id: publish
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with: &release_inputs
          tag_name: ${{ github.event.release.tag_name || inputs.target_release_tag || (github.ref == 'refs/heads/main' && 'v1.0.0') || github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            release/app-release.apk
            release/app-release.apk.sha256

      - name: Wait before retrying release upload
        if: steps.publish.outcome == 'failure'
        run: sleep 20

      - name: Retry attaching APK to GitHub Release
        if: steps.publish.outcome == 'failure'
        uses: softprops/action-gh-release@v3
        with: *release_inputs
