name: Mobile overdue task reminders

on:
  schedule:
    - cron: '5,35 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check the reminder service without sending notifications'
        type: boolean
        default: true

permissions: {}

concurrency:
  group: android-overdue-task-reminders
  cancel-in-progress: false

jobs:
  send:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Request scheduled reminders from Supabase
        env:
          REMINDER_ENDPOINT: https://mjfclxcklkbgsivvvlfe.supabase.co/functions/v1/portal-web-push
          REMINDER_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          node --input-type=module <<'NODE'
          const endpoint = process.env.REMINDER_ENDPOINT;
          const identity = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          identity.searchParams.set('audience', endpoint + '/scheduled-reminders');
          const issued = await fetch(identity, {
            headers: { Authorization: 'Bearer ' + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN },
            redirect: 'error',
            signal: AbortSignal.timeout(15000)
          });
          if (!issued.ok) throw new Error('GitHub job identity unavailable (HTTP ' + issued.status + ').');
          const { value } = await issued.json();
          if (typeof value !== 'string' || !value) throw new Error('GitHub job identity was empty.');
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Portal-Reminder-Identity': value },
            body: JSON.stringify({ action: 'scheduled_remind', dryRun: process.env.REMINDER_DRY_RUN === 'true' }),
            redirect: 'error',
            signal: AbortSignal.timeout(120000)
          });
          if (!response.ok) throw new Error('Scheduled reminders failed (HTTP ' + response.status + ').');
          const result = await response.json();
          if (result.dryRun) console.log('Reminder configuration verified for ' + result.recipients + ' eligible recipients.');
          else console.log('Overdue reminders sent: Android ' + result.fcmSent + ', iPhone/iPad ' + result.sent + '.');
          NODE
